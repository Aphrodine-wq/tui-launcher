[package]
name = "tui-launcher"
version = "0.2.0"
edition = "2024"
description = "A PSP-inspired XMB console hub for Linux terminals"
license = "MIT"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29"
directories = "6.0"
freedesktop-desktop-entry = { version = "0.8.1", default-features = false }
freedesktop-icons = "0.4.0"
gilrs = "0.11.2"
image = { version = "0.25.10", default-features = false, features = ["ico", "jpeg", "png", "webp"] }
mpris = "2.1.0"
ratatui = "0.30.2"
ratatui-image = { version = "11.0.6", default-features = false, features = ["crossterm", "image-defaults"] }
resvg = { version = "0.48.1", default-features = false, features = ["raster-images", "svgz", "text", "system-fonts"] }
rodio = { version = "0.22.2", default-features = false, features = ["playback", "wav"] }
serde = { version = "1.0", features = ["derive"] }
steam-vdf-parser = "0.1.2"
toml = "0.9"
unicode-width = "0.2"
ureq = { version = "3.4", default-features = false, features = ["rustls", "gzip"] }

[profile.release]
lto = "thin"
strip = true
