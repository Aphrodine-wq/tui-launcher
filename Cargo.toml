[package]
name = "tui-launcher"
version = "0.4.0"
edition = "2024"
description = "A native PSP-inspired XMB desktop overlay for Linux"
license = "MIT"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4.5", features = ["derive"] }
directories = "6.0"
eframe = { version = "0.36.1", default-features = false, features = ["default_fonts", "wayland", "wgpu", "x11"] }
freedesktop-desktop-entry = { version = "0.8.1", default-features = false }
freedesktop-icons = "0.4.0"
gilrs = "0.11.2"
image = { version = "0.25.10", default-features = false, features = ["ico", "jpeg", "png", "webp"] }
mpris = "2.1.0"
resvg = { version = "0.48.1", default-features = false, features = ["raster-images", "svgz", "text", "system-fonts"] }
rodio = { version = "0.22.2", default-features = false, features = ["playback", "wav"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
steam-vdf-parser = "0.1.2"
toml = "0.9"
ureq = { version = "3.4", default-features = false, features = ["rustls", "gzip"] }

[profile.release]
lto = "thin"
strip = true
